[workspace]
members = ["crates/protocol", "crates/server", "crates/web"]
# A bare `cargo build` should not try to build the wasm frontend for the host.
default-members = ["crates/protocol", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Endre Erős <endre.eros@chalmersindustriteknik.se>"]

[workspace.dependencies]
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.140"
log = "0.4.22"
micro_sp_gui_protocol = { path = "crates/protocol" }
