<!-- Trunk entry point. `trunk build` compiles crates/web to wasm and emits
     everything into ./dist, which micro_sp_gui_server serves. -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="color-scheme" content="dark light" />
  <title>micro_sp</title>

  <!-- data-target-name picks the cdylib; the crate also has a native dev binary. -->
  <link data-trunk rel="rust" href="crates/web/Cargo.toml" data-target-name="micro_sp_gui_web"
    data-wasm-opt="z" />

  <style>
    html,
    body {
      overflow: hidden;
      margin: 0 !important;
      padding: 0 !important;
      height: 100%;
      width: 100%;
      background: #100e0c;
    }

    /* egui draws the whole UI into this one canvas. */
    canvas {
      margin: 0 !important;
      padding: 0 !important;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* Shown until wasm has loaded, and replaced with the reason if it fails. */
    #centered {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      color: #9a9a9a;
      text-align: center;
    }

    .spinner {
      margin: 0 auto 12px;
      width: 24px;
      height: 24px;
      border: 3px solid #333;
      border-top-color: #8ab4f8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <canvas id="micro_sp_gui_canvas"></canvas>
  <div id="centered">
    <div id="loading_text">
      <div class="spinner"></div>
      <p>Loading micro_sp_gui…</p>
    </div>
  </div>
</body>

</html>
