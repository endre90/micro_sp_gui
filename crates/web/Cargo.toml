[package]
name = "micro_sp_gui_web"
description = "The micro_sp_gui egui frontend, compiled to wasm."
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# A desktop shell for development only; the browser build ignores it.
[[bin]]
name = "micro_sp_gui_dev"
path = "src/main.rs"

[dependencies]
micro_sp_gui_protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true

# `glow` only: one renderer keeps the wasm bundle small, and WebGL is available
# everywhere this needs to run.
eframe = { version = "0.32.0", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.32"
egui_extras = { version = "0.32" }
# Both work on wasm and natively.
ewebsock = "0.8"
ehttp = "0.5"
regex = "1.12.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The native dev shell needs winit's Linux backends, which live in eframe's
# default features. The browser build has no use for them.
eframe = { version = "0.32.0", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
    "wayland",
] }
env_logger = "0.11.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "HtmlCanvasElement"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
